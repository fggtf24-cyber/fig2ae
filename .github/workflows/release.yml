# Push a tag v1.2.3 -> tests -> GitHub release with Fig2AE.zip.
# The site links to releases/latest/download/Fig2AE.zip; installed copies update themselves from it.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node make-release.js
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Fig2AE.zip --title "Fig2AE $GITHUB_REF_NAME" --generate-notes
