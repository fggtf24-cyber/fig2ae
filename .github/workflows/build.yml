name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node make-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: Fig2AE-windows
          path: Fig2AE-Setup.exe
          if-no-files-found: error
